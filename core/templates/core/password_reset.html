{% extends "base.html" %}
{% load static %}

{% block content %}
<div style="max-width: 500px; margin: auto; text-align: center; color: white;">
    <h2>Forgot Your Password?</h2>
    <p>Enter your email below, and we’ll send a secure link to reset your password.</p>

    <form method="post" style="margin-top: 20px;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="
            background-color: rgb(68, 156, 190);
            color: #000;
            font-weight: bold;
            border-radius: 8px;
            padding: 10px 20px;
            margin-top: 10px;
            border: none;
            cursor: pointer;
        ">Send Reset Link</button>
    </form>

    <p style="margin-top: 15px;">
        <a href="{% url 'login' %}" style="color: rgb(93, 166, 235); text-decoration: underline;">Back to Login</a>
    </p>
</div>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>{{ form_title }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Save</button>
        <a href="{% url 'monthly_summary_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
<a href="{% url 'dashboard' %}"
   style="display: inline-block; margin-top: 20px; padding: 8px 12px; background-color: #30aac9ff; text-decoration: none; border-radius: 5px;">
   Back to Dashboard
</a>
{% endblock %}

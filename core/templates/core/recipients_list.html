{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Meal Recipients</h2>
        <a href="{% url 'recipient_create' %}" class="btn btn-primary">
            + Add Recipient
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            {% if recipients %}
            <div class="table-responsive">
                <table class="table">
                    <thead class="table-light">
                        <tr>
                            <th>Name</th>
                          
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for recipient in recipients %}
                        <tr>
                            <td class="fw-medium">{{ recipient.name }}</td>
                           
                            <td class="text-end">
                                <a href="{% url 'recipient_update' recipient.id %}" class="btn btn-sm btn-outline-primary">Edit</a>
                                <a href="{% url 'recipient_delete' recipient.id %}" class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('Are you sure you want to delete {{ recipient.name }}?');">Delete</a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            {% else %}
            <div class="text-center py-4">
                <p class="text-muted mb-3">No recipients found.</p>
                <a href="{% url 'recipient_create' %}" class="btn btn-primary">
                    + Add Your First Recipient
                </a>
            </div>
            {% endif %}
        </div>
    </div>
        <a href="{% url 'dashboard' %}"
   style="display: inline-block; margin-top: 20px; padding: 8px 12px; background-color: #30aac9ff; text-decoration: none; border-radius: 5px;">
   Back to Dashboard
</a>

    </div>
</div>

<style>
.card {
    border: 1px solid #e9ecef;
    border-radius: 6px;
}

.table th {
    background-color: #f8f9fa;
    border-bottom: 1px solid #dee2e6;
    font-weight: 600;
    color: #495057;
}

.btn {
    border-radius: 4px;
    font-weight: 500;
}

.btn-sm {
    padding: 0.25rem 0.75rem;
    font-size: 0.875rem;
}
</style>
{% endblock %}

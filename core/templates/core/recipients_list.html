{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Meal Recipients</h2>
    <a href="{% url 'recipient_create' %}" class="btn btn-primary mb-3">+ Add Recipient</a>

    <table class="table table-bordered table-striped">
        <thead>
            <tr>
                <th>Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for recipient in recipients %}
            <tr>
                <td>{{ recipient.name }}</td>
                <td>
                    <a href="{% url 'recipient_update' recipient.id %}" class="btn btn-sm btn-warning">Edit</a>
                    <a href="{% url 'recipient_delete' recipient.id %}" class="btn btn-sm btn-danger"
                       onclick="return confirm('Are you sure you want to delete this recipient?');">Delete</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="2" class="text-center">No recipients found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
<a href="{% url 'dashboard' %}"
   style="display: inline-block; margin-top: 20px; padding: 8px 12px; background-color: #30aac9ff; text-decoration: none; border-radius: 5px;">
   Back to Dashboard
</a>
{% endblock %}

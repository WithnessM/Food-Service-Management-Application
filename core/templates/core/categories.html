{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
  <h2>Categories</h2>

  <table class="table table-bordered">
    <thead style="background: rgb(53, 110, 143);">
      <tr>
        <th>NO</th>
        <th>CATEGORY DESCRIPTION</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for category in categories %}
      <tr>
        <td>{{ category.category_no }}</td>
        <td>{{ category.description }}</td>
        <td>
          <a href="{% url 'category_edit' category.pk %}">Edit</a> |
          <a href="{% url 'category_delete' category.pk %}">Delete</a>
        </td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="3">No categories found.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <p style="margin-top: 15px;">
    <a href="{% url 'category_add' %}" class="btn btn-primary">Add New Category</a>
  </p>

  <a href="{% url 'dashboard' %}"
   style="display: inline-block; margin-top: 20px; padding: 8px 12px; background-color: #30aac9ff; text-decoration: none; border-radius: 5px;">
   Back to Dashboard
</div>
{% endblock %}

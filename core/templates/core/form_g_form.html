{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2 class="mb-3">{{ title }}</h2>

  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}

    <div class="mt-3">
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{% url 'form_g_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>

<a href="{% url 'dashboard' %}"
   style="display: inline-block; margin-top: 20px; padding: 8px 12px; background-color: #30aac9ff; text-decoration: none; border-radius: 5px;">
   Back to Dashboard
</a>
</div>
{% endblock %}

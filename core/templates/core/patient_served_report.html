{% extends 'base.html' %}
{% block content %}
<h1>Patient Served Report</h1>
<p>Monthly totals:</p>
<ul>
    {% for entry in monthly_totals %}
        <li>{{ entry.month|date:"F Y" }} - {{ entry.category }}: {{ entry.total }}</li>
    {% empty %}
        <li>No data</li>
    {% endfor %}
</ul>


<a href="{% url 'cost_per_meal_report_pdf' %}" 
   target="_blank" 
   style="display: inline-block; margin-top: 20px; padding: 10px 15px; background-color: #3da3c2ff; color: white; text-decoration: none; border-radius: 5px;">
   View PDF
</a>

<a href="{% url 'dashboard' %}" 
   style="display: inline-block; margin-top: 20px; padding: 8px 12px; background-color: #ddd; text-decoration: none; border-radius: 5px;">
   ← Back to Home
</a>
{% endblock %}

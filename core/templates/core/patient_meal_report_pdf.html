<html>
<head>
    <title>Patient Meal Distribution PDF</title>
</head>
<body>
    <h1>Patient Meal Distribution Report</h1>
    <table border="1" cellpadding="10" cellspacing="0" style="width: 100%;">
        <thead>
            <tr>
                <th>Patient Number</th>
                <th>Category</th>
                <th>Menu Assigned</th>
            </tr>
        </thead>
        <tbody>
            {% for patient in patients %}
            <tr>
                <td>{{ patient.patient_number }}</td>
                <td>{{ patient.category }}</td>
                <td>
                    {% if patient.menu %}
                        {{ patient.menu.name }}
                    {% else %}
                        Not Assigned
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>

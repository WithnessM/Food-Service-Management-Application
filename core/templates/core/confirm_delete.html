{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
  <h2>{{ title }}</h2>
  <p>Are you sure you want to delete <strong>{{ object }}</strong>?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'dashboard' %}" class="btn btn-secondary ms-2">Cancel</a>
  </form>
</div>
{% endblock %}

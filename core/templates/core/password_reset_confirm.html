{% extends "base.html" %}
{% load static %}

{% block content %}
<div style="max-width: 500px; margin: auto; text-align: center; color: white;">
    <h2>Set a New Password</h2>
    <p>Please enter a new password for your account.</p>

    <form method="post" style="margin-top: 20px;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="
            background-color: rgb(68, 156, 190);
            color: #000;
            font-weight: bold;
            border-radius: 8px;
            padding: 10px 20px;
            margin-top: 10px;
            border: none;
            cursor: pointer;
        ">Change Password</button>
    </form>
</div>
{% endblock %}

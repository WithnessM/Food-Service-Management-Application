{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Confirm Delete</h2>
    <p>Are you sure you want to delete this meal: 
        <strong>{{ meal.mealDate }} - {{ meal.get_mealCategory_display }} for {{ meal.mealsFor.name }}</strong>?
    </p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'meals_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}

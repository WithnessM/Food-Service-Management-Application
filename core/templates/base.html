{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>FSMA</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <style>
        body {
            background-image: url("{% static 'images/coat-of-arms.jpg' %}"); 
            background-size: 40% auto;  
            background-repeat: no-repeat;
            background-attachment: fixed; 
            background-position: center;
            color: white; 
            margin: 0;
            font-family: Arial, sans-serif;
        }
        header {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            background-color: rgba(29, 122, 177, 0.8);
        }
        header img {
            height: 50px;
            margin-right: 15px;
        }
        header h1 {
            margin: 0;
            font-size: 1.8rem;
        }
        main {
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.5); 
            border-radius: 10px;
            max-width: 900px;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <header>
        <img src="{% static 'images/logo.png' %}" alt="FSMA Logo">
        <h1>FSMA</h1>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
